<!DOCTYPE html>
<html lang="es">

<head>
  <link rel="stylesheet" href="estilo.css">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de firma</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body class="bodygenerador">
  <!-- En el siguiente div clase formulario tengo contenido el formulario // También necesario para posicionamiento en pagina -->
  <div>
  <form class="formulario">
    <h2 style="color:rgba(22, 17, 38, 0.9); text-align: center;">DATOS PARA TU FIRMA</h2>
    <div>
        <div class="row">
            <div class="col">
                <!-- nombre del empleado // campo 1/6 -->
                <Input type="text" id="nombre" placeholder="Ingresa el nombre a mostrar" onkeyup="V_nombre(this.value)" />
            </div>
        </div>
        <div class="row">
            <div class="col">
                <!-- Puesto del empleado // campo 2/6 -->
                <Input type="text" id="puesto" placeholder="Puesto de trabajo" onkeyup="V_Puesto(this.value)"/>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <Input type="text" id="Vista_tel" placeholder="Área o departamento"onkeyup="V_dept(this.value)"/>

                <!-- Número de celular // campo 3/6 -->
                <Input type="text"  placeholder="Teléfono movil (Opcional)"  onkeyup= "V_cel(this.value)"/>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label for="v_ext">Tel: 2236-0900 ext:</label>
                <Input style="display: inline;" type="text" id="V_ext" placeholder="Extesión" onkeyup= "V_Ext(this.value)"/>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <Input type="text" id="mail" placeholder="correo@outlook.com" onkeyup="V_mail(this.value)"/>
            </div>
        </div>

    </div>
        <br>
    <div class="botones">
        <button type="reset" onclick="location.reload()" style="background-color: rgb(255, 255, 255,0.3);color: #000;">Limpiar campos</button>
    </div>   
</form>

  </div>
  <!-- La siguiente linea es para anexar la firma generada configurada en JavaScript -->
  <div class="cajafirma"  id="tablafirma">
	<table >
		<tbody>
			<tr>
				<!-- En el siguiente td está el logo -->
				<td><a href="https://www.hospitalmaria.org/" target="_blank"><img class="logofirma" alt="" src="logo.jpg"
                width="180" height="111"/></a></td>
				<!-- Aquí termina el td del logo -->
				<!-- Estas td (Columna) conforman el separador vertical de color -->
				<td style="width: 13px;"></td>
				<td style="width: 1px; background-color: #f79d00;" ></td>
				<td style="width: 13px;"></td>
				<!-- Hasta aquí el separador vertical (Verificar si se puede agregar sombra) -->
				<!-- Aqui inicia la tablita de el texto -->
				<td>
					<table class="firma1texto">
						<tbody>
							<tr>
								<td style=" font-size:16px; color:#000; font-weight:bold;">
                                <span id="Vista_nombre">Nombre del colaborador</span>
								</td>
							</tr>
							<tr>

								<td style="color:#4c4b4c;font-weight: bold;font-size: 11px;">
                                    <span id="Vista_puesto">Puesto de trabajo</span>
								</td>
							</tr>
							<tr style="border-bottom: 3px solid black;">
								<td style="color:#4c4b4c;font-weight: bold;font-size: 11px;">
                                    <span id="Vista_departamento">Departamento</span>
								</td>
							</tr >

								<td style="height: 14px;color:#333333;">
